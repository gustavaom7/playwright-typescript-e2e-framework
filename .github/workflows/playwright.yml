name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Nightly full run across every browser and mobile project
    - cron: '0 6 * * *'
  workflow_dispatch:

# One deploy at a time; a newer run supersedes a queued older one
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # Optional. Without this secret the triage step still runs, it just does not post to Slack.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Get installed Playwright version
        # Single-quoting the node -p argument avoids nested-double-quote breakage in bash
        run: echo "PLAYWRIGHT_VERSION=$(node -p 'require("@playwright/test/package.json").version')" >> $GITHUB_ENV
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      # Push/PR: Chromium + Chrome mobile for a fast signal. Nightly/manual: every project.
      - name: Run Playwright tests (Chromium)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        # @visual has no reviewed baseline committed yet, so it doesn't gate push/PR CI.
        # See .github/workflows/visual-regression.yml to generate and review the baseline;
        # once it's committed, drop this env block so @visual joins the regular run.
        env:
          SEM_TAG: '@visual'
        run: npx playwright test --project=chromium-public --project=chromium-auth --project=chromium-session --project=mobile-chrome
      - name: Run Playwright tests (all browsers)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # Same as above: @visual stays out until its reviewed baseline is committed.
        env:
          SEM_TAG: '@visual'
        run: npm test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      # Automated defect triage: groups failures across browsers, classifies and ranks them,
      # and writes Jira-ready bug drafts. Runs even when the tests failed (that is the point).
      - name: Triage failures into bug drafts
        if: ${{ !cancelled() }}
        run: npx tsx scripts/triage-failures.ts | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bug-report-drafts
          path: bug-reports/
          retention-days: 30
      - name: Notify Slack (failures, and every nightly run)
        if: ${{ env.SLACK_WEBHOOK_URL != '' && hashFiles('bug-reports/slack-payload.json') != '' && (failure() || github.event_name == 'schedule') }}
        run: |
          curl -sS -X POST -H 'Content-type: application/json' --data @bug-reports/slack-payload.json "$SLACK_WEBHOOK_URL"
      # Only main publishes: PRs must not overwrite the public report
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        with:
          path: playwright-report/

  deploy-report:
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
